name: iOS baseline build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat 3105-1.1.1-original.tar.gz.part-* > 3105-1.1.1-original.tar.gz
          mkdir -p source build dist
          tar -xzf 3105-1.1.1-original.tar.gz -C source
      - name: Build baseline IPA
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=source/3105-1.1.1/ThreeOneOSFive.xcodeproj
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/build/baseline.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=$(find build/baseline.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "$GITHUB_WORKSPACE/dist/baseline.ipa" Payload)
          test -s dist/baseline.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-ipa
          path: dist/baseline.ipa
